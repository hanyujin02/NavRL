defaults:
  - drone       # sensor.depth_range/height/width/focal_length/horizontal_aperture
  - ppo         # algo settings + feature_extractor encoder options
  - sim
  - _self_      # train_depth.yaml overrides take highest priority

env_script: env_depth   # selects training/scripts/env_depth.py
# checkpoint: /home/hanyujin/NavRL/isaac-training/wandb/run-20260625_132712-ofte5ogv/files/checkpoint_10000.pt        # path to .pt file to resume from; null = train from scratch
checkpoint: null

headless: True
device: "cuda:0"
seed: 0

# Total Training Length
max_frame_num: 12e8
eval_interval: 1000
save_interval: 1000

# Training Environment
env:
  num_envs: 350          # increase to 1024 for full training (RTX 4090 recommended)
  max_episode_length: 2200
  env_spacing: 8.0
  num_obstacles: 300
  use_dijkstra_reward: false
  dijkstra_map_extent: 24.0       # covers randomized start/goal sides; terrain obstacles remain within map_range
  dijkstra_grid_resolution: 0.4   # metres/cell for the training-time potential map
  dijkstra_obstacle_height: 0.2   # cells above this terrain height are treated as blocked
  dijkstra_inflate_radius: 0.3    # metres of obstacle inflation for the potential map
  dijkstra_reward_scale: 1.0
  dijkstra_reward_clip: 2.0
  use_cbf_safety_reward: false
  cbf_obstacle_inflate_radius: 0.0 # keep raw obstacle geometry; cbf_safe_margin defines safety buffer
  cbf_safe_margin: 0.3            # h = distance_to_obstacle - margin
  cbf_gamma: 2.0                  # forward-invariance condition: h_dot + gamma * h >= 0
  cbf_reward_scale: 1.0
  cbf_reward_clip: 5.0

env_dyn:
  num_obstacles: 0       # set to 0 for static-only environment
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

wandb:
  project: NavRL-depth
  name: depth_vit_scratch
  entity: null            # null = use the logged-in user's default entity
  mode: online            # set to 'offline' to disable cloud sync
  run_id:

# ---------------------------------------------------------------------------
# Depth camera sensor  (mirrors drone.yaml — set here for visibility)
# ---------------------------------------------------------------------------
sensor:
  depth_range: 5.0        # max sensing range (m); must match algo.feature_extractor.rep_depth_max_m
  depth_height: 60        # image height (pixels)
  depth_width: 80         # image width (pixels)
  focal_length: 10.0      # ~90 deg horizontal FOV: hfov = 2*atan(aperture/(2*focal_length))
  horizontal_aperture: 20.955
  # LiDAR for safety reward (mirrors train.yaml / env_lidar.py defaults)
  lidar_range: 4.0
  lidar_vfov: [-10., 20.]   # degrees
  lidar_vbeams: 4
  lidar_hres: 10.            # degrees → 36 horizontal beams

# ---------------------------------------------------------------------------
# Encoder selection  (overrides ppo.yaml defaults)
# ---------------------------------------------------------------------------
# Choose one block below and uncomment it, or pass overrides on the command line.

# ── Option A: Simple CNN trained from scratch (default) ──────────────────────
# algo:
#   feature_extractor:
#     encoder_type: scratch
#     embed_dim: 256

# ── Option B: ReachMap CNN+GRU with pretrained checkpoint ────────────────────
# algo:
#   feature_extractor:
#     encoder_type: cnn_gru
#     encoder_ckpt: /home/hanyujin/ReachMap/checkpoints/cnn_gru_reach+policy/best.pt
#     freeze_encoder: false   # true = freeze encoder, train PPO heads only
#     embed_dim: 256
#     gru_layers: 2

# ── Option C: ReachMap CNN, no temporal, fine-tuned from scratch ─────────────
# algo:
#   feature_extractor:
#     encoder_type: cnn
#     embed_dim: 256

# ── Option D: ReachMap depth ViT, no temporal, trained from scratch ──────────
algo:
  feature_extractor:
    use_dyn_obs_net: false
    obs_image_key: depth
    encoder_type: vit
    encoder_ckpt: null
    # encoder_ckpt: /home/hanyujin/ReachMap/checkpoints/depth-cnn_20260626_025327/latest.pt
    encoder_ckpt_submodule: ""
    freeze_encoder: false
    embed_dim: 256
    img_h: 60
    img_w: 80
    patch_size: 10
    vit_depth: 4
    num_heads: 8
    drop: 0.1

# ── Option E: ReachMap BEV CNN, no temporal, frozen backbone ─────────────────
# algo:
#   feature_extractor:
#     use_dyn_obs_net: false
#     encoder_type: bev_cnn
#     encoder_ckpt: /home/hanyujin/ReachMap/checkpoints/debug-bev-cnn-reach-state_20260516_021556/best.pt
#     encoder_ckpt_submodule: spatial  # load encoder.spatial.* only (backbone weights)
#     freeze_encoder: true
#     embed_dim: 256
#     bev_grid_size: 50
#     bev_map_range: 5.0
#     bev_height_clip: 2.0

# ── Option F: Pretrained vitfly RepCNN (RepBaseline) ─────────────────────────
# algo:
#   feature_extractor:
#     encoder_type: rep_cnn
#     embed_dim: 256
#     encoder_ckpt: /path/to/reachmap/checkpoints/<run>/best.pt
#     freeze_encoder: true
#     rep_depth_max_m: 4.0  # must match sensor.depth_range
