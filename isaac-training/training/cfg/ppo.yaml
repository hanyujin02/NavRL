algo:
  # Only used when network_type: transformer (env_lidar.py gates its ring
  # buffer on this) -- gives the 'state' (and dynamic_obstacle, when enabled)
  # tokens a real windowed history, matching NavRL++'s active 'transformer'
  # architecture (env.py's lidar_history/state_history/dyn_obs_state_history
  # ring buffers). cnn/gru ignore this entirely -- env_lidar.py only builds
  # the buffer and widens observation_spec when network_type=="transformer",
  # so their single-frame state is byte-identical to before this was added.
  state:
    history_length: 2.0   # seconds of history the window should cover
    dt: 0.5                # seconds between sampled frames within that window

  # Feature-extractor architecture (PPO.__init__ in ppo.py):
  #   'cnn'         (default) — depth_encoder + optional dyn-obstacle MLP,
  #                  concatenated with state, then an MLP. Unchanged behavior.
  #   'transformer' — depth_encoder's output tokenized alongside dynamic
  #                  obstacle / state streams and fused via a small
  #                  Transformer (ported from NavRL++, see algo.transformer
  #                  below and utils.py's BuildTokens/TransformerBackbone).
  #                  Intended to be paired with dynamic obstacles enabled
  #                  (env_dyn.num_obstacles / feature_extractor.dyn_obs_num /
  #                  feature_extractor.use_dyn_obs_net) for the "robust"
  #                  profile — see train_depth_robust.yaml.
  #   'gru'         — depth_encoder + state (+ dyn-obstacle) CONCATENATED
  #                  into one vector like 'cnn', then fed through a GRU that
  #                  carries real hidden state across env steps (see
  #                  algo.gru below). Unlike 'transformer', this is genuine
  #                  cross-step temporal memory, not just per-timestep
  #                  multi-modal fusion.
  network_type: cnn

  feature_extractor:
    learning_rate: 1e-5
    dyn_obs_num: 0

    # Observation key for the image input: 'lidar' (default), 'depth', or 'bev'
    # 'bev' is set automatically when encoder_type starts with 'bev_'
    obs_image_key: depth

    # Depth encoder selection
    # 'scratch'         — simple 3-layer CNN, trained from scratch (default)
    # ReachMap encoders — import from /ReachMap/model/:
    #   'cnn'               CNNOnlyEncoder        (no temporal)
    #   'vit'               ViTOnlyEncoder        (no temporal)
    #   'cnn_gru'           TemporalCNNEncoder    (CNN + GRU)
    #   'vit_gru'           TemporalViTEncoder    (ViT + GRU)
    #   'cnn_transformer'   TemporalTransformerCNNEncoder
    #   'vit_transformer'   TemporalTransformerViTEncoder
    #   'rep_cnn'           RepCNNOnlyEncoder     (pretrained vitfly ConvNet)
    #   'rep_cnn_gru'       RepCNNGRUEncoder
    #   'rep_cnn_transformer' RepCNNTransformerEncoder
    #   'rep_vit'           RepViTOnlyEncoder     (pretrained vitfly ViT)
    #   'rep_vit_gru'       RepViTGRUEncoder
    #   'rep_vit_transformer' RepViTTransformerEncoder
    #   'rep_vae'           RepVAEOnlyEncoder     (pretrained mavrl VAE)
    #   'rep_vae_gru'       RepVAEGRUEncoder
    #   'rep_vae_transformer' RepVAETransformerEncoder
    # BEV encoders — depth back-projected to top-down grid; obs key = 'bev':
    #   'bev_cnn'           BEVCNNOnlyEncoder
    #   'bev_vit'           BEVViTOnlyEncoder
    #   'bev_cnn_gru'       TemporalBEVCNNEncoder
    #   'bev_vit_gru'       TemporalBEVViTEncoder
    #   'bev_cnn_transformer' TemporalTransformerBEVCNNEncoder
    #   'bev_vit_transformer' TemporalTransformerBEVViTEncoder
    encoder_type: scratch

    # Path to a ReachMap checkpoint (best.pt / latest.pt) to initialise the
    # encoder weights.  Only used when encoder_type != 'scratch'.
    # The encoder.* sub-keys are extracted automatically; task heads are ignored.
    encoder_ckpt: null

    # Submodule of the encoder to load from the checkpoint.
    # "" (default) loads all encoder.* keys (full encoder).
    # "spatial"    loads only encoder.spatial.* keys (backbone only),
    #              matching ReachMap's freeze_spatial pattern in scripts/train.py.
    encoder_ckpt_submodule: ""

    # Freeze encoder weights after loading checkpoint (fine-tune PPO heads only)
    freeze_encoder: false

    # Only consulted when freeze_encoder=true. true (default) freezes
    # BatchNorm running_mean/var too (encoder stays in eval() mode always —
    # see ReachMapEncoderWrapper). false leaves conv/linear weights frozen
    # (requires_grad=False) but lets BN running stats keep adapting to the
    # live rollout data distribution during training.
    freeze_bn: true

    # Output feature dimension (must match embed_dim used when training the ckpt)
    embed_dim: 256
    projection_mlp: true  # add a 2-layer MLP projection head after the encoder output

    # Depth image dimensions fed to the encoder (should match sensor config)
    img_h: 64
    img_w: 64

    # ViT spatial encoder settings (used for 'vit*' and 'rep_vit*' types)
    patch_size: 8      # 64/8 = 8 patches per side for 64x64 input
    vit_depth: 4
    num_heads: 8

    # GRU / Transformer temporal settings (used for *_gru and *_transformer types)
    gru_layers: 2
    seq_len: 10
    temporal_depth: 2
    temporal_heads: 8
    drop: 0.1

    # RepBaseline backbone settings (used for 'rep_*' types only)
    rep_depth_max_m: 5.0      # must match sensor.depth_range (used to de-normalise [0,1] → metres)
    rep_vae_latent: 64
    rep_freeze_backbone: true  # freeze RepBaseline backbone weights; train only projection + temporal heads

    # RepBaseline pretrained backbone checkpoint paths.
    # Each is loaded into the spatial backbone at construction time,
    # exactly as ReachMap's build_model does via _rep_ckpt_path().
    #   rep_cnn  →  vitfly ConvNet  (e.g. RepBaseline/vitfly/models/ConvNet_model.pth)
    #   rep_vit  →  vitfly ViT      (e.g. RepBaseline/vitfly/models/ViT_model.pth)
    #   rep_vae  →  mavrl VAE       (e.g. RepBaseline/mavrl/exp_vae/vae/best.tar)
    rep_cnn_ckpt: null
    rep_vit_ckpt: null
    rep_vae_ckpt: null

    # BEV encoder settings (used for 'bev_*' types only)
    # Depth image is back-projected to a (bev_grid_size × bev_grid_size) top-down grid.
    # cell_size = bev_map_range / (bev_grid_size / 2) — forward/lateral resolution.
    bev_grid_size: 50
    bev_map_range: 5.0       # metres from drone centre to each grid edge
    bev_height_clip: 2.0     # matches training data collection (habitat.yaml bev_height_clip)
    bev_patch_size: 10       # ViT patch size for BEV grid (bev_grid_size % bev_patch_size == 0)

  # Only used when algo.network_type: transformer. Defaults match NavRL++.
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 4
    dim_feedforward: 128
    dropout: 0.1
    max_T: 8                        # upper bound for the positional-encoding table (this pipeline's obs are single-frame, T=1)
    feature_extractor_mlp: [256, 256]

  # Only used when algo.network_type: gru. Fuses depth_encoder + state (+
  # dynamic-obstacle, mirrors feature_extractor.use_dyn_obs_net) via the same
  # concat pattern as 'cnn' into ONE per-timestep vector, then feeds that
  # into a GRU that carries real hidden state ACROSS ENV STEPS -- unlike
  # 'transformer', which only fuses modalities within a single timestep.
  gru:
    input_size: 256    # width of the pre-GRU fusion MLP; must equal hidden_size below
    hidden_size: 256
    num_layers: 1
    dropout: 0.0

  actor:
    learning_rate: 5e-5
    clip_ratio: 0.2   # matches depth_cnn_pretrain run (7lu8r8pv)
    action_limit: 2.0

  critic:
    learning_rate: 5e-5
    clip_ratio: 0.2   # matches depth_cnn_pretrain run (7lu8r8pv)

  entropy_loss_coefficient: 1e-2

  # LR decay over training iterations (one iteration = one collector batch =
  # num_envs * training_frame_num frames). Applied to feature_extractor, actor,
  # critic (and aux) optimizers. Late-run eval oscillation motivated this
  # (adjacent-eval SR swings of ±0.2 at 40k+ iters with constant lr).
  lr_decay: null          # null | linear | cosine
  lr_decay_iters: 4e4     # iterations to reach the floor; stays at floor after
  lr_decay_min_factor: 0.1  # floor = base_lr * this factor

  training_frame_num: 64
  training_epoch_num: 2
  num_minibatches: 8