defaults:
  - drone
  - ppo
  - sim
  - _self_      # _self_ must be last so this file's overrides win over ppo.yaml's
                # defaults (e.g. obs_image_key: depth) — matches train_depth.yaml's
                # pattern. Previously _self_ was first, which silently let
                # ppo.yaml's obs_image_key: depth default override this file
                # (env_lidar.py only ever produces a "lidar" obs key, not "depth").

checkpoint: null        # path to .pt file to resume from; null = train from scratch

headless: True
device: "cuda:0"
seed: 0

# Total Training Length
max_frame_num: 6e8 # max frame 
eval_interval: 1000 # evaluate the policy for every N training steps
save_interval: 1000

# Training Environment
env:
  num_envs: 512 # Number of drones for training
  max_episode_length: 2200
  env_spacing: 8.0 
  num_obstacles: 350

env_dyn:
  num_obstacles: 0  # static-only (was 80) — pure-static lidar+transformer config
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

# Pure-static lidar + transformer network_type. algo.feature_extractor.dyn_obs_num
# stays at ppo.yaml's default (0), so BuildTokens automatically drops the
# dynamic-obstacle token (see ppo.py's transformer branch / utils.py's
# BuildTokens use_dynamic flag) — no dead all-zero token, consistent with
# env_dyn.num_obstacles: 0 above.
algo:
  feature_extractor:
    obs_image_key: lidar   # required override — ppo.yaml's default is now "depth"
                            # (set for the depth-camera branch); env_lidar.py's
                            # observation dict only has a "lidar" key.
    learning_rate: 2e-4     # matches NavRL-plus-plus's ppo.yaml (was 5e-4 default)
    encoder_type: lidar_navrlpp   # NavRL++'s exact static-obstacle CNN (was 'scratch' default)
  network_type: transformer

  # PPO hyperparameters aligned to NavRL-plus-plus's ppo.yaml exactly, so this
  # comparison isolates the code/environment differences (state-window port,
  # LayerNorm/ValueNorm fixes) rather than hyperparameter differences. Only
  # overridden here (not in the shared ppo.yaml) so train_depth*.yaml's
  # already-tuned settings are untouched.
  actor:
    learning_rate: 2e-4    # was 5e-5
    clip_ratio: 0.1        # was 0.2
    action_limit: 3.0      # was 2.0
  critic:
    learning_rate: 2e-4    # was 1e-4
    clip_ratio: 0.1        # was 0.2
  entropy_loss_coefficient: 1e-3   # was 1e-2
  training_frame_num: 256          # was 64
  training_epoch_num: 4            # was 2
  num_minibatches: 32              # was 8

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

# LiDAR sensor params (overrides drone.yaml sensor block for lidar training)
sensor:
  lidar_range: 4.0
  lidar_vfov: [-10, 20.]   # degrees
  lidar_vbeams: 4
  lidar_hres: 10.           # degrees

wandb:
  project: NavRL-depth-deploy
  name: navigation_training(lidar)
  entity: null            # null = use the logged-in user's default entity
  mode: online # online
  run_id: #kw9xf9k9
