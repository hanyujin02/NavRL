# ---------------------------------------------------------------------------
# Static environment / obstacle configuration
#
# obstacle_mode:
#   hf       — original 2.5D heightfield pillars (axis-aligned, no orientation;
#              the obstacle block below is ignored)
#   oriented — single merged mesh of boxes with random yaw + roll/pitch
#
# NOTE: the Dijkstra / CBF rewards only support a 2D occupancy grid.
# In "oriented" mode obstacles are conservatively projected onto the XY plane
# over the flight height band [dijkstra_obstacle_height, map_range[2]]:
# a tilted beam blocks its whole footprint even where the drone could pass
# under/over it. 3D (height-aware) distance fields are NOT implemented.
#
# Preview the generated layout without launching Isaac Sim:
#   conda activate NavRL
#   python training/scripts/preview_env.py            # saves PNG + GLB
#   python training/scripts/preview_env.py --show     # interactive 3D window
# ---------------------------------------------------------------------------
env:
  map_range: [20.0, 20.0, 4.5]    # half-extent x/y (m) and max flight height z (m)
  obstacle_mode: hf               # keep 'hf' to reproduce depth_cnn_pretrain; set 'oriented' for the 3D env
  policy_3d: false                # true = drop the per-episode height-band penalty so the policy can
                                  # fly over/under obstacles (use together with obstacle_mode: oriented);
                                  # false = original 2D behavior (required to reproduce depth_cnn_pretrain)
  attitude_obs: true             # true = append body roll/pitch (rad) to the state input (8 → 10 dims);
                                  # helps disambiguate body-fixed depth-camera tilt from tilted obstacles
                                  # in 3D mode. false = original 8-dim state (required for old checkpoints
                                  # and to reproduce depth_cnn_pretrain)
  num_obstacles: 300
  obstacle:
    seed: 2                       # RNG seed for the obstacle layout (also used by preview_env.py)
    width_range: [0.4, 1.1]       # box x-size (m)
    length_range: [0.4, 1.1]      # box y-size (m)
    height_range: [1.0, 1.5, 2.0, 4.0, 6.0]       # interval edges (m), one more entry than probabilities
    height_probability: [0.10, 0.15, 0.20, 0.55]  # probability of each height interval
    yaw_range: [0.0, 360.0]       # deg, always uniform (no preferred horizontal direction)
    roll_range: [-90.0, 90.0]     # deg, hard bounds for the tilt
    pitch_range: [-25.0, 25.0]    # deg, hard bounds for the tilt
    tilt_distribution: normal     # 'normal' = truncated normal centered at the range midpoint
                                  #   (mostly-upright obstacles, occasional strong tilts);
                                  # 'uniform' = flat over [min, max]
    tilt_std: 10.0                # deg, std of the truncated normal (used only when 'normal')
    min_center_distance: 1.5      # min xy distance between obstacle centers (m); auto-relaxes if unsatisfiable
    border_margin: 1.0            # keep obstacle centers this far from the map edge (m)
