# Trajectory-recording variant of gazebo_eval.yaml — same trial layout, plus
# plotting inputs. See gazebo_eval.yaml for the meaning of every field below
# that isn't new here.
# Usage (after `roslaunch uav_simulator start.launch` and
#         `roslaunch navigation_runner navigation.launch` are both up):
#   rosrun navigation_runner gazebo_eval_traj.py

num_trials: 10
x_range: [-8.0, 8.0]
y_start: -12.0
y_goal: 12.0
z: null

success_radius: 0.5
collision_radius: 0.15
min_check_delay_s: 2.0

reposition_tol: 1.0
reposition_timeout_s: 40.0
trial_timeout_s: 60.0
rate_hz: 10.0            # also the trajectory-recording rate

odom_topic: /CERLAB/quadcopter/odom
goal_topic: /move_base_simple/goal

# null = auto-resolve to uav_simulator/worlds/generated_env/generated_env_static.pcd
pcd_path: null

# null = auto-resolve to uav_simulator/worlds/generated_env/generated_env_static.world
# — parsed only to draw obstacle footprints (cylinders/boxes) under the
# plotted trajectories. Override if running a different world.
world_path: null

results_dir: eval_results
